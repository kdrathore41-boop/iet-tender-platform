name: IET Collector Validation

on:
  push:
    paths:
      - "data.json"
      - "collector.js"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IET
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tender data
        run: node collector.js
