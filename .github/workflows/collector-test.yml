name: IET Collector Validation

on:
  push:
    paths:
      - "data.json"
      - "collector.js"
      - "cppp-adapter.js"
      - "test-cppp-adapter.js"
      - "test-cppp-integration.js"
      - ".github/workflows/collector-test.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IET
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tender data
        run: node collector.js

      - name: Test CPPP adapter
        run: node test-cppp-adapter.js

      - name: Test CPPP integration
        run: node test-cppp-integration.js
