name: IET Collector Validation

on:
  push:
    paths:
      - "data.json"
      - "collector.js"
      - "cppp-adapter.js"
      - "tender-collector.js"
      - "test-cppp-adapter.js"
      - "test-cppp-integration.js"
      - ".github/workflows/collector-test.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IET
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tender data
        run: node collector.js

      - name: Test CPPP adapter
        run: node test-cppp-adapter.js

      - name: Test CPPP integration
        run: node test-cppp-integration.js

      - name: Test CPPP live source
        run: |
          node -e "
          require('./tender-collector').fetchCPPP()
          .then(r => {
            console.log('CPPP LIVE TEST:', r.success);
            console.log('Tenders found:', r.tenderCount);
            if (!r.success) process.exit(1);
          })
          .catch(e => {
            console.error('CPPP LIVE TEST FAILED');
            console.error(e.message);
            process.exit(1);
          })
          "
