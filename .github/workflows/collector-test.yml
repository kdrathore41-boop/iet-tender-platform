name: IET CPPP Live Data Update

on:
  workflow_dispatch:
  push:
    paths:
      - "tender-collector.js"
      - "cppp-adapter.js"
      - "collector.js"
      - "test-cppp-adapter.js"
      - "test-cppp-integration.js"
      - ".github/workflows/collector-test.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IET
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate tender data
        run: node collector.js

      - name: Test CPPP adapter
        run: node test-cppp-adapter.js

      - name: Test CPPP integration
        run: node test-cppp-integration.js

      - name: Fetch CPPP live tenders
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const { fetchCPPP } = require("./tender-collector");

          async function main() {
            const result = await fetchCPPP();

            console.log("CPPP CONNECTION:", result.success);
            console.log("LIVE TENDERS:", result.tenderCount);

            if (!result.success || result.tenderCount === 0) {
              throw new Error("No live CPPP tenders received");
            }

            const liveTenders = result.tenders.map((tender, index) => ({
              id: `CPPP-LIVE-${index + 1}`,
              title: tender.title,
              organization: "Central Public Procurement Portal",
              location: "",
              state: "",
              category: "",
              value: "",
              publishDate: "",
              closingDate: "",
              tenderFee: "",
              emd: "",
              workPeriod: "",
              status: "Open",
              officialSource: "CPPP",
              officialLink: tender.officialLink,
              verificationStatus: "SOURCE_REVIEW_REQUIRED",
              lastUpdated: result.fetchedAt
            }));

            const output = {
              platform: "IET - India E-Tender Platform",
              source: "CPPP",
              sourceType: "live-public-listing",
              generatedAt: result.fetchedAt,
              totalTenders: liveTenders.length,
              tenders: liveTenders
            };

            fs.writeFileSync(
              "data.json",
              JSON.stringify(output, null, 2),
              "utf8"
            );

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## IET CPPP Live Data\n\n` +
              `- **Connection:** SUCCESS\n` +
              `- **Live tenders received:** ${liveTenders.length}\n` +
              `- **Data file:** data.json\n`
            );
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Save live CPPP data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update live CPPP tender data"
            git push
          fi
