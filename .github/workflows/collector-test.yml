name: IET Collector Validation

on:
  push:
    paths:
      - "data.json"
      - "collector.js"
      - "cppp-adapter.js"
      - "tender-collector.js"
      - "test-cppp-adapter.js"
      - "test-cppp-integration.js"
      - ".github/workflows/collector-test.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IET
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate tender data
        run: node collector.js

      - name: Test CPPP adapter
        run: node test-cppp-adapter.js

      - name: Test CPPP integration
        run: node test-cppp-integration.js

      - name: Test CPPP live source
        id: cppp
        run: |
          node - <<'NODE'
          const { fetchCPPP } = require("./tender-collector");

          fetchCPPP()
            .then(result => {
              console.log("CPPP LIVE TEST:", result.success);
              console.log("Tenders found:", result.tenderCount);

              const fs = require("fs");

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `## CPPP Live Source Test\n\n` +
                `- **Connection:** SUCCESS\n` +
                `- **Tenders found:** ${result.tenderCount}\n` +
                `- **Fetched at:** ${result.fetchedAt}\n`
              );
            })
            .catch(error => {
              console.error("CPPP LIVE TEST FAILED");
              console.error(error.message);

              const fs = require("fs");

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `## CPPP Live Source Test\n\n` +
                `- **Connection:** FAILED\n` +
                `- **Error:** ${error.message}\n`
              );

              process.exit(1);
            });
          NODE
