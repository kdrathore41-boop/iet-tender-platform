<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IET - India E-Tender Platform</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#222;
}

header{
  background:#123b6d;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:6px;
  font-size:14px;
}

.container{
  max-width:1050px;
  margin:25px auto;
  padding:0 15px;
}

.search-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.search-box h2{
  color:#123b6d;
  margin-bottom:15px;
}

.search-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.search-row input,
.search-row select{
  flex:1;
  min-width:180px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  border-radius:7px;
  padding:13px 18px;
  cursor:pointer;
  font-size:15px;
}

.search-btn{
  background:#123b6d;
  color:white;
}

.clear-btn{
  background:#777;
  color:white;
}

.results{
  margin-top:25px;
}

.result-count{
  margin-bottom:12px;
  color:#555;
  font-weight:bold;
}

.tender-card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.tender-card h3{
  color:#123b6d;
  margin-bottom:10px;
}

.tender-card p{
  margin:6px 0;
  font-size:14px;
}

.view-btn{
  margin-top:12px;
  background:#16834b;
  color:white;
}

.no-results{
  background:white;
  padding:25px;
  border-radius:10px;
  text-align:center;
  color:#777;
}

.hidden{
  display:none;
}

.detail-page{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.detail-page h2{
  color:#123b6d;
  margin-bottom:20px;
}

.detail-row{
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.detail-row strong{
  display:inline-block;
  width:190px;
}

.status{
  display:inline-block;
  padding:5px 12px;
  border-radius:20px;
  background:#dff5e8;
  color:#16834b;
  font-weight:bold;
}

.back-btn{
  background:#555;
  color:white;
  margin-bottom:18px;
}

.official-btn{
  display:inline-block;
  margin-top:22px;
  padding:13px 20px;
  background:#16834b;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.official-btn:hover{
  background:#11663b;
}

@media(max-width:600px){

  header h1{
    font-size:23px;
  }

  .search-row{
    flex-direction:column;
  }

  .search-row input,
  .search-row select,
  .search-row button{
    width:100%;
  }

  .detail-row strong{
    display:block;
    width:auto;
    margin-bottom:5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>IET - India E-Tender Platform</h1>
  <p>Search and explore government tenders across India</p>
</header>

<div class="container">

<!-- ================= SEARCH PAGE ================= -->

<div id="searchPage">

  <div class="search-box">

    <h2>Search Tenders</h2>

    <div class="search-row">

      <input
        type="text"
        id="searchInput"
        placeholder="State, Company or Tender..."
      >

      <input
        type="text"
        id="tenderIdInput"
        placeholder="Tender ID..."
      >

      <select id="category">

        <option value="">All Categories</option>

        <option value="Construction">
          Construction
        </option>

        <option value="Road">
          Road
        </option>

        <option value="Electrical">
          Electrical
        </option>

        <option value="IT">
          IT
        </option>

        <option value="Supply">
          Supply
        </option>

      </select>

      <button
        class="search-btn"
        onclick="searchTenders()">
        Search
      </button>

      <button
        class="clear-btn"
        onclick="clearSearch()">
        Clear
      </button>

    </div>

  </div>


  <div class="results">

    <div
      id="resultCount"
      class="result-count">
    </div>

    <div id="tenderResults"></div>

  </div>

</div>


<!-- ================= DETAIL PAGE ================= -->

<div id="detailPage" class="hidden">

  <button
    class="back-btn"
    onclick="showSearchPage()">
    ← Back to Results
  </button>

  <div class="detail-page">

    <h2 id="detailTitle"></h2>

    <div class="detail-row">
      <strong>Tender ID</strong>
      <span id="detailId"></span>
    </div>

    <div class="detail-row">
      <strong>Organization</strong>
      <span id="detailOrg"></span>
    </div>

    <div class="detail-row">
      <strong>Location</strong>
      <span id="detailLocation"></span>
    </div>

    <div class="detail-row">
      <strong>Category</strong>
      <span id="detailCategory"></span>
    </div>

    <div class="detail-row">
      <strong>Estimated Value</strong>
      <span id="detailValue"></span>
    </div>

    <div class="detail-row">
      <strong>Publish Date</strong>
      <span id="detailPublishDate"></span>
    </div>

    <div class="detail-row">
      <strong>Closing Date</strong>
      <span id="detailDate"></span>
    </div>

    <div class="detail-row">
      <strong>Tender Fee</strong>
      <span id="detailFee"></span>
    </div>

    <div class="detail-row">
      <strong>EMD</strong>
      <span id="detailEmd"></span>
    </div>

    <div class="detail-row">
      <strong>Work Period</strong>
      <span id="detailWorkPeriod"></span>
    </div>

    <div class="detail-row">
      <strong>Status</strong>
      <span
        id="detailStatus"
        class="status">
      </span>
    </div>

    <a
      id="officialLink"
      class="official-btn"
      href="#"
      target="_blank">
      Official Tender
    </a>

  </div>

</div>

</div>


<script>

/* ================= TENDER DATA ================= */

const tenders = [

  {
    id:"IET-MH-001",
    title:"Road Construction and Development Work",
    organization:"Public Works Department Maharashtra",
    location:"Maharashtra",
    category:"Road",
    value:"₹12.50 Crore",
    publishDate:"28 August 2026",
    date:"30 September 2026",
    tenderFee:"₹5,000",
    emd:"₹25,00,000",
    workPeriod:"12 Months",
    status:"Open",
    officialLink:"https://example.com"
  },

  {
    id:"IET-MH-002",
    title:"Construction of Government Building",
    organization:"Government of Maharashtra",
    location:"Mumbai, Maharashtra",
    category:"Construction",
    value:"₹8.20 Crore",
    publishDate:"28 August 2026",
    date:"12 October 2026",
    tenderFee:"₹7,500",
    emd:"₹16,40,000",
    workPeriod:"18 Months",
    status:"Open",
    officialLink:"https://example.com"
  },

  {
    id:"IET-BHEL-001",
    title:"Supply of Industrial Electrical Equipment",
    organization:"BHEL",
    location:"Bhopal, Madhya Pradesh",
    category:"Electrical",
    value:"₹2.75 Crore",
    publishDate:"27 August 2026",
    date:"05 October 2026",
    tenderFee:"₹3,000",
    emd:"₹5,50,000",
    workPeriod:"6 Months",
    status:"Open",
    officialLink:"https://example.com"
  },

  {
    id:"IET-BHEL-002",
    title:"IT Hardware and Network Infrastructure",
    organization:"BHEL",
    location:"Bengaluru, Karnataka",
    category:"IT",
    value:"₹1.85 Crore",
    publishDate:"26 August 2026",
    date:"18 October 2026",
    tenderFee:"₹2,500",
    emd:"₹3,70,000",
    workPeriod:"8 Months",
    status:"Open",
    officialLink:"https://example.com"
  },

  {
    id:"IET-MP-001",
    title:"Road Repair and Maintenance Work",
    organization:"Madhya Pradesh Road Development Corporation",
    location:"Bhopal, Madhya Pradesh",
    category:"Road",
    value:"₹6.40 Crore",
    publishDate:"25 August 2026",
    date:"22 October 2026",
    tenderFee:"₹4,000",
    emd:"₹12,80,000",
    workPeriod:"10 Months",
    status:"Open",
    officialLink:"https://example.com"
  },

  {
    id:"IET-UP-001",
    title:"Supply of Construction Materials",
    organization:"Government Procurement Department",
    location:"Lucknow, Uttar Pradesh",
    category:"Supply",
    value:"₹3.10 Crore",
    publishDate:"24 August 2026",
    date:"28 October 2026",
    tenderFee:"₹3,500",
    emd:"₹6,20,000",
    workPeriod:"5 Months",
    status:"Open",
    officialLink:"https://example.com"
  }

];


/* ================= CURRENT RESULTS ================= */

let currentResults = tenders;


/* ================= DISPLAY TENDERS ================= */

function displayTenders(list){

  const results =
    document.getElementById("tenderResults");

  const count =
    document.getElementById("resultCount");

  results.innerHTML = "";

  count.innerText =
    list.length + " tender(s) found";


  if(list.length === 0){

    results.innerHTML = `
      <div class="no-results">
        No tenders found.
        Try another State, Company or Category.
      </div>
    `;

    return;
  }


  list.forEach((tender,index)=>{

    results.innerHTML += `

      <div class="tender-card">

        <h3>${tender.title}</h3>

        <p>
          <strong>Organization:</strong>
          ${tender.organization}
        </p>

        <p>
          <strong>Location:</strong>
          ${tender.location}
        </p>

        <p>
          <strong>Category:</strong>
          ${tender.category}
        </p>

        <p>
          <strong>Estimated Value:</strong>
          ${tender.value}
        </p>

        <p>
          <strong>Closing Date:</strong>
          ${tender.date}
        </p>

        <button
          class="view-btn"
          onclick="openTender(${index})">
          View Details
        </button>

      </div>

    `;

  });

}


/* ================= SEARCH ================= */

function searchTenders(){

  const searchText =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const tenderId =
    document.getElementById("tenderIdInput")
    .value
    .toLowerCase()
    .trim();

  const selectedCategory =
    document.getElementById("category").value;


  currentResults =
    tenders.filter(tender => {

      const searchableText = (

        tender.title + " " +
        tender.organization + " " +
        tender.location + " " +
        tender.category

      ).toLowerCase();


      const textMatch =
        searchText === "" ||
        searchableText.includes(searchText);


      const idMatch =
        tenderId === "" ||
        tender.id.toLowerCase().includes(tenderId);


      const categoryMatch =
        selectedCategory === "" ||
        tender.category === selectedCategory;


      return (
        textMatch &&
        idMatch &&
        categoryMatch
      );

    });


  displayTenders(currentResults);
}


/* ================= CLEAR SEARCH ================= */

function clearSearch(){

  document.getElementById("searchInput").value = "";

  document.getElementById("tenderIdInput").value = "";

  document.getElementById("category").value = "";

  currentResults = tenders;

  displayTenders(tenders);
}


/* ================= OPEN DETAILS ================= */

function openTender(index){

  const tender = currentResults[index];


  document.getElementById("searchPage")
    .classList.add("hidden");

  document.getElementById("detailPage")
    .classList.remove("hidden");


  document.getElementById("detailTitle")
    .innerText = tender.title;

  document.getElementById("detailId")
    .innerText = tender.id;

  document.getElementById("detailOrg")
    .innerText = tender.organization;

  document.getElementById("detailLocation")
    .innerText = tender.location;

  document.getElementById("detailCategory")
    .innerText = tender.category;

  document.getElementById("detailValue")
    .innerText = tender.value;

  document.getElementById("detailPublishDate")
    .innerText = tender.publishDate;

  document.getElementById("detailDate")
    .innerText = tender.date;

  document.getElementById("detailFee")
    .innerText = tender.tenderFee;

  document.getElementById("detailEmd")
    .innerText = tender.emd;

  document.getElementById("detailWorkPeriod")
    .innerText = tender.workPeriod;

  document.getElementById("detailStatus")
    .innerText = tender.status;

  document.getElementById("officialLink")
    .href = tender.officialLink;

}


/* ================= BACK ================= */

function showSearchPage(){

  document.getElementById("detailPage")
    .classList.add("hidden");

  document.getElementById("searchPage")
    .classList.remove("hidden");

}


/* ================= START ================= */

displayTenders(tenders);

</script>

</body>
  </html>
