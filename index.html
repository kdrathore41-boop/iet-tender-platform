<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IET - India E-Tender Platform</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#222;
}

header{
  background:#123b6d;
  color:white;
  padding:18px 20px;
  text-align:center;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:6px;
  font-size:14px;
  opacity:.9;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.search-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.search-box h2{
  margin-bottom:15px;
  color:#123b6d;
}

.search-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.search-row input,
.search-row select{
  flex:1;
  min-width:180px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  border-radius:7px;
  padding:13px 20px;
  cursor:pointer;
  font-size:15px;
}

.search-btn{
  background:#123b6d;
  color:white;
}

.search-btn:hover{
  background:#0d2e55;
}

.results{
  margin-top:25px;
}

.result-count{
  margin-bottom:12px;
  font-weight:bold;
  color:#555;
}

.tender-card{
  background:white;
  padding:18px;
  margin-bottom:14px;
  border-radius:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.tender-card h3{
  color:#123b6d;
  margin-bottom:9px;
}

.tender-card p{
  margin:5px 0;
  font-size:14px;
}

.view-btn{
  margin-top:12px;
  background:#16834b;
  color:white;
}

.view-btn:hover{
  background:#11663b;
}

.hidden{
  display:none;
}

.detail-page{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.detail-page h2{
  color:#123b6d;
  margin-bottom:18px;
}

.detail-row{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.detail-row strong{
  display:inline-block;
  width:180px;
}

.back-btn{
  background:#555;
  color:white;
  margin-bottom:18px;
}

.apply-btn{
  background:#16834b;
  color:white;
  margin-top:20px;
}

.no-results{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  color:#777;
}

@media(max-width:600px){
  header h1{
    font-size:23px;
  }

  .search-row{
    flex-direction:column;
  }

  .search-row input,
  .search-row select,
  .search-btn{
    width:100%;
  }

  .detail-row strong{
    display:block;
    width:auto;
    margin-bottom:4px;
  }
}
</style>
</head>

<body>

<header>
  <h1>IET - India E-Tender Platform</h1>
  <p>Search and explore government tenders across India</p>
</header>

<div class="container">

  <!-- SEARCH PAGE -->
  <div id="searchPage">

    <div class="search-box">
      <h2>Search Tenders</h2>

      <div class="search-row">

        <input
          type="text"
          id="searchInput"
          placeholder="Search State, Company, Tender..."
        >

        <select id="category">
          <option value="">All Categories</option>
          <option value="Construction">Construction</option>
          <option value="Road">Road</option>
          <option value="Electrical">Electrical</option>
          <option value="IT">IT</option>
          <option value="Supply">Supply</option>
        </select>

        <button class="search-btn" onclick="searchTenders()">
          Search
        </button>

      </div>
    </div>

    <div class="results">

      <div id="resultCount" class="result-count"></div>

      <div id="tenderResults"></div>

    </div>

  </div>


  <!-- DETAIL PAGE -->
  <div id="detailPage" class="hidden">

    <button class="back-btn" onclick="showSearchPage()">
      ← Back to Results
    </button>

    <div class="detail-page">

      <h2 id="detailTitle"></h2>

      <div class="detail-row">
        <strong>Tender ID:</strong>
        <span id="detailId"></span>
      </div>

      <div class="detail-row">
        <strong>Organization:</strong>
        <span id="detailOrg"></span>
      </div>

      <div class="detail-row">
        <strong>Location:</strong>
        <span id="detailLocation"></span>
      </div>

      <div class="detail-row">
        <strong>Category:</strong>
        <span id="detailCategory"></span>
      </div>

      <div class="detail-row">
        <strong>Estimated Value:</strong>
        <span id="detailValue"></span>
      </div>

      <div class="detail-row">
        <strong>Closing Date:</strong>
        <span id="detailDate"></span>
      </div>

      <div class="detail-row">
        <strong>Status:</strong>
        <span>Open</span>
      </div>

      <button class="apply-btn" onclick="alert('Tender application module will be connected in the next stage.')">
        Apply / View Official Tender
      </button>

    </div>

  </div>

</div>


<script>

const tenders = [

  {
    id:"IET-MH-001",
    title:"Road Construction and Development Work",
    organization:"Public Works Department Maharashtra",
    location:"Maharashtra",
    category:"Road",
    value:"₹12.50 Crore",
    date:"30 September 2026"
  },

  {
    id:"IET-MH-002",
    title:"Construction of Government Building",
    organization:"Government of Maharashtra",
    location:"Mumbai, Maharashtra",
    category:"Construction",
    value:"₹8.20 Crore",
    date:"12 October 2026"
  },

  {
    id:"IET-BHEL-001",
    title:"Supply of Industrial Electrical Equipment",
    organization:"BHEL",
    location:"Bhopal, Madhya Pradesh",
    category:"Electrical",
    value:"₹2.75 Crore",
    date:"05 October 2026"
  },

  {
    id:"IET-BHEL-002",
    title:"IT Hardware and Network Infrastructure",
    organization:"BHEL",
    location:"Bengaluru, Karnataka",
    category:"IT",
    value:"₹1.85 Crore",
    date:"18 October 2026"
  },

  {
    id:"IET-MP-001",
    title:"Road Repair and Maintenance Work",
    organization:"Madhya Pradesh Road Development Corporation",
    location:"Bhopal, Madhya Pradesh",
    category:"Road",
    value:"₹6.40 Crore",
    date:"22 October 2026"
  },

  {
    id:"IET-UP-001",
    title:"Supply of Construction Materials",
    organization:"Government Procurement Department",
    location:"Lucknow, Uttar Pradesh",
    category:"Supply",
    value:"₹3.10 Crore",
    date:"28 October 2026"
  }

];


function displayTenders(list){

  const results = document.getElementById("tenderResults");
  const count = document.getElementById("resultCount");

  results.innerHTML = "";

  count.innerText = list.length + " tender(s) found";

  if(list.length === 0){

    results.innerHTML = `
      <div class="no-results">
        No tenders found. Try another State, Company or Category.
      </div>
    `;

    return;
  }


  list.forEach((tender,index)=>{

    results.innerHTML += `

      <div class="tender-card">

        <h3>${tender.title}</h3>

        <p><strong>Organization:</strong> ${tender.organization}</p>

        <p><strong>Location:</strong> ${tender.location}</p>

        <p><strong>Category:</strong> ${tender.category}</p>

        <p><strong>Estimated Value:</strong> ${tender.value}</p>

        <p><strong>Closing Date:</strong> ${tender.date}</p>

        <button
          class="view-btn"
          onclick="openTender(${index})">
          View Details
        </button>

      </div>

    `;

  });

}


let currentResults = tenders;


function searchTenders(){

  const searchText =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const selectedCategory =
    document.getElementById("category").value;


  currentResults = tenders.filter(tender => {

    const searchableText = (

      tender.title + " " +
      tender.organization + " " +
      tender.location + " " +
      tender.category

    ).toLowerCase();


    const textMatch =
      searchText === "" ||
      searchableText.includes(searchText);


    const categoryMatch =
      selectedCategory === "" ||
      tender.category === selectedCategory;


    return textMatch && categoryMatch;

  });


  displayTenders(currentResults);

}


function openTender(index){

  const tender = currentResults[index];

  document.getElementById("searchPage")
    .classList.add("hidden");

  document.getElementById("detailPage")
    .classList.remove("hidden");


  document.getElementById("detailTitle")
    .innerText = tender.title;

  document.getElementById("detailId")
    .innerText = tender.id;

  document.getElementById("detailOrg")
    .innerText = tender.organization;

  document.getElementById("detailLocation")
    .innerText = tender.location;

  document.getElementById("detailCategory")
    .innerText = tender.category;

  document.getElementById("detailValue")
    .innerText = tender.value;

  document.getElementById("detailDate")
    .innerText = tender.date;

}


function showSearchPage(){

  document.getElementById("detailPage")
    .classList.add("hidden");

  document.getElementById("searchPage")
    .classList.remove("hidden");

}


// Show all tenders when page loads
displayTenders(tenders);

</script>

</body>
  </html>
